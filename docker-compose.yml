# Local development stack — docs/architecture/environments.md
#
#   cp .env.example .env   (optional — dev defaults are baked in below)
#   docker compose up --build
#
# Services: db (PostgreSQL 16) · backend (Django ASGI) · worker (django-q2
# qcluster, database-backed — no Redis) · frontend (Next.js dev).
# Production topology: docs/architecture/deployment.md

name: knowledge-marketplace

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hem}
      POSTGRES_DB: ${POSTGRES_DB:-hem}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    entrypoint: ["/app/docker/entrypoint.sh"]
    # runserver (not raw uvicorn) for the DEV stack: runserver serves Django's
    # /static/ (uvicorn does not), so the admin's actions.js loads and bulk
    # actions work; daphne (installed before staticfiles in dev.py) keeps the
    # server ASGI for Channels WebSockets.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key-change-me}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: ${DATABASE_URL:-postgres://hem:hem@db:5432/hem}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-manual}
      EMAIL_BACKEND_MODE: ${EMAIL_BACKEND_MODE:-console}
      FILE_STORAGE: ${FILE_STORAGE:-local}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/var/media}
      DJANGO_SEED_ADMIN_PASSWORD: ${DJANGO_SEED_ADMIN_PASSWORD:-admin-demo-1234}
    volumes:
      - ./backend:/app
      - media:/app/var/media
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./backend
      target: dev
    entrypoint: ["/app/docker/entrypoint.worker.sh"]
    command: ["python", "manage.py", "qcluster"]
    environment: *backend_env
    volumes:
      - ./backend:/app
      - media:/app/var/media
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  media:
  frontend_node_modules:
