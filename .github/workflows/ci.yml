name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, contracts, migrations, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hem
          POSTGRES_PASSWORD: hem
          POSTGRES_DB: hem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hem:hem@127.0.0.1:5432/hem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (lint + format)
        run: |
          ruff check .
          ruff format --check .
      - name: Modular-monolith dependency contracts
        run: lint-imports
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: |
          set -o pipefail
          pytest --cov=apps --cov=config --cov-report=term-missing -q | tee /tmp/pytest.log || {
            echo "::group::pytest failure tail"
            tail -60 /tmp/pytest.log
            echo "::endgroup::"
            grep -E "^(FAILED|ERROR)|short test summary|=====" /tmp/pytest.log | tail -8 | while IFS= read -r line; do echo "::error::${line:0:250}"; done
            exit 1
          }
      # Phase 12: the production safety checks are only useful if they still
      # fire. Assert both directions — a dangerous config is refused, and a
      # correct one passes — so nobody can quietly neuter the deploy gate.
      - name: Production safety gate (apps/core/checks.py)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: api.example.com
        run: |
          echo "--- a dangerous production config must be REFUSED ---"
          if DEPLOY_ENV=production SECRET_KEY=dev-only-insecure-key-change-me \
             python manage.py check --deploy --tag production --fail-level WARNING 2>/dev/null; then
            echo "::error::production safety checks did NOT refuse a dev SECRET_KEY"
            exit 1
          fi
          echo "refused, as expected"

          echo "--- a correct production config must PASS ---"
          DEPLOY_ENV=production \
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
          ADMIN_URL="ops-ci-path/" \
          EMAIL_BACKEND_MODE=brevo BREVO_API_KEY=ci-placeholder \
          DEFAULT_FROM_EMAIL=no-reply@example.com \
          FILE_STORAGE=r2 R2_BUCKET=b R2_ACCOUNT_ID=a R2_ACCESS_KEY=k R2_SECRET_KEY=s \
          MANUAL_WEBHOOK_SECRET="ci-random-secret" \
          FRONTEND_URL=https://app.example.com BACKEND_URL=https://api.example.com \
          python manage.py check --deploy --tag production --fail-level WARNING

      - name: Dependency audit (known CVEs)
        run: |
          pip install -q pip-audit
          pip-audit --desc off

  frontend:
    name: Frontend (lint, types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Dependency audit (prod deps, high+ blocks)
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docs-sync:
    name: Docs sync (env vars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_env_docs.py

  deploy-config:
    name: Deployment config (compose, Caddy, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Phase 12 ships executable deployment artifacts. A typo in a shell
      # script is only discovered during an incident unless CI parses it.
      - name: Shell scripts parse and are executable
        run: |
          for s in scripts/*.sh backend/docker/*.sh; do
            test -x "$s" || { echo "::error::$s is not executable"; exit 1; }
            bash -n "$s" || { echo "::error::$s has a syntax error"; exit 1; }
            echo "ok $s"
          done
      - name: Production compose file is valid
        run: |
          # Placeholders only — this validates structure/interpolation, and the
          # `:?` guards prove every required variable is actually declared.
          set -a
          DEPLOY_ENV=staging SECRET_KEY=x ALLOWED_HOSTS=a DATABASE_URL=postgres://u@h/d
          FRONTEND_URL=https://a BACKEND_URL=https://b
          CORS_ALLOWED_ORIGINS=https://a CSRF_TRUSTED_ORIGINS=https://a
          ADMIN_URL=ops/ MANUAL_WEBHOOK_SECRET=s EMAIL_BACKEND_MODE=brevo
          DEFAULT_FROM_EMAIL=no-reply@example.com
          POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=d
          NEXT_PUBLIC_API_URL=https://api NEXT_PUBLIC_WS_URL=wss://api
          NEXT_PUBLIC_SITE_URL=https://www
          SITE_DOMAIN=www.example.com APP_DOMAIN=app.example.com
          ADMIN_DOMAIN=admin.example.com API_DOMAIN=api.example.com
          ACME_EMAIL=ops@example.com
          set +a
          docker compose -f docker-compose.prod.yml config --quiet
          echo "docker-compose.prod.yml is valid"
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e SITE_DOMAIN=www.example.com -e APP_DOMAIN=app.example.com \
            -e ADMIN_DOMAIN=admin.example.com -e API_DOMAIN=api.example.com \
            -e ACME_EMAIL=ops@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: No real secrets in the committed env template
        run: |
          # Every secret-ish line in .env.prod.example must still be a placeholder.
          if grep -nE '^(SECRET_KEY|POSTGRES_PASSWORD|MANUAL_WEBHOOK_SECRET|BACKUP_PASSPHRASE|ADMIN_URL)=' \
               .env.prod.example | grep -v 'CHANGE_ME'; then
            echo "::error::.env.prod.example contains a non-placeholder secret"
            exit 1
          fi
          echo "env template is placeholder-only"

  compose-smoke:
    name: Compose smoke (clean checkout → up → seed → worker → e2e)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Host-side test deps BEFORE compose up: the dev frontend container writes
      # root-owned artifacts through the bind mount, so host npm must not run after it.
      - name: Install frontend test deps (host)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start stack
        run: docker compose up --build -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz; then echo "backend healthy"; exit 0; fi
            sleep 2
          done
          echo "backend never became healthy"; docker compose logs backend; exit 1
      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then echo "frontend up"; exit 0; fi
            sleep 2
          done
          echo "frontend never came up"; docker compose logs frontend; exit 1
      - name: API root + schema
        run: |
          curl -sf http://localhost:8000/api/v1/ | grep -q "Hybrid Expert Marketplace API"
          curl -sf http://localhost:8000/api/schema/ -H "Accept: application/json" | grep -q openapi
      - name: Worker processes a task
        run: docker compose exec -T backend python manage.py worker_smoke --timeout 30
      - name: Seed demo data
        run: docker compose exec -T backend python manage.py seed_demo
      # The dev email backend is console; the q2 worker prints verification
      # emails to its container stdout. Stream that log to the host path the
      # Playwright helpers poll (e2e/helpers.ts E2E_DELIVERY_LOG default).
      - name: Stream worker output (verification emails) for e2e
        run: |
          docker compose logs -f worker > /tmp/hem-mail.log 2>&1 &
          echo $! > /tmp/mail-tee.pid
      - name: E2E smoke (Playwright)
        working-directory: frontend
        run: |
          if ! npm run e2e > /tmp/pw.log 2>&1; then
            grep -E "[0-9]+\) \[chromium\]|✘|✗|failed|Error:|TimeoutError|expected" /tmp/pw.log | head -30 | while IFS= read -r line; do echo "::error::e2e: ${line:0:220}"; done
            grep -B1 -A8 "Error:" /tmp/pw.log | head -60 | while IFS= read -r line; do echo "::error::e2e-ctx: ${line:0:240}"; done
            curl -s http://localhost:3000/ | grep -oE "<h1[^>]*>[^<]{0,60}|__next_error__|Application error" | head -4 | while IFS= read -r line; do echo "::error::html: ${line:0:200}"; done
            docker compose logs backend --tail 400 2>&1 | grep -E "admin/|CSRF|Forbidden|ERROR|Traceback" | head -12 | while IFS= read -r line; do echo "::error::be: ${line:0:240}"; done
            docker compose logs frontend --tail 120 2>&1 | grep -iE "⨯|error|unhandled|failed" | head -12 | while IFS= read -r line; do echo "::error::fe: ${line:0:240}"; done
            tail -6 /tmp/hem-mail.log 2>/dev/null | while IFS= read -r line; do echo "::error::mail: ${line:0:200}"; done
            exit 1
          fi
      - name: Upload e2e diagnostics (traces + page snapshots + log)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            frontend/test-results/
            /tmp/pw.log
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Tear down
        if: always()
        run: |
          kill "$(cat /tmp/mail-tee.pid)" 2>/dev/null || true
          docker compose down -v
